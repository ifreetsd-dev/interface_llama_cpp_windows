[package]
name = "interface"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.27", features = ["glow"] }
egui = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "process"] }
rfd = "0.14"
directories = "5.0"
crossbeam-channel = "0.5"
chrono = "0.4"
futures = "0.3"
nvml-wrapper = "0.10"
reqwest = { version = "0.12", features = ["json", "stream"] }
zip = "2"
tempfile = "3"